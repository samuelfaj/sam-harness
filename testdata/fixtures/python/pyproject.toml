[project]
name = "fixture-python"
version = "0.1.0"
dependencies = ["fastapi", "sqlalchemy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
