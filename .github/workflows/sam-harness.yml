# Generated by sam-harness. Edit .sam-harness/config.yaml, not this file.
# Happy path: check → test → build → deploy → verify → release → monitor
# Exception path: failure → repair / rollback → verify
# Prefer these jobs over host CI that only repeats the same gates.
# GitHub job names remain static/test/e2e/artifact/staging/production/observe; map them onto that graph.
name: sam-harness

on:
  pull_request:
  merge_group:
  push:
  workflow_dispatch:
    inputs:
      phase:
        description: Explicit lifecycle action
        required: true
        type: choice
        options:
          - rollback
      artifact_run_id:
        description: Successful workflow run containing the immutable artifact and artifact receipt
        required: true
        type: string
  schedule:
    - cron: '0 15 * * 3'
      # Configured IANA timezone: UTC; GitHub evaluates cron in UTC.

permissions:
  contents: read
  actions: read
  pull-requests: read


jobs:
  static:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Check out trusted base configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: .sam-harness/evidence/trusted-control
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      - name: Require trusted base configuration
        run: |
          test -s "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" || { echo "trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed" >&2; exit 1; }
      - name: Run static phase
        id: phase
        continue-on-error: true
        run: |
          phase_output="$(mktemp)"
          trap 'rm -f "$phase_output"' EXIT
          set +e
          go run ./cmd/sam-harness pipeline . --config "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" --phase static --receipt true 2>&1 | tee "$phase_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          status="${pipeline_status[0]}"
          receipt="$(sed -n 's/^Receipt: //p' "$phase_output" | tail -n 1)"
          test -n "$receipt"
          test -f "$receipt"
          receipt_html="${receipt%.json}.html"
          test -f "$receipt_html"
          printf 'phase_receipt=%s\nphase_receipt_html=%s\n' "$receipt" "$receipt_html" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-static
          if-no-files-found: error
          path: |
            ${{ steps.phase.outputs.phase_receipt }}
            ${{ steps.phase.outputs.phase_receipt_html }}

      - name: Preserve the failed phase status
        if: steps.phase.outcome == 'failure'
        run: exit 1
  test:
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Check out trusted base configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: .sam-harness/evidence/trusted-control
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      - name: Require trusted base configuration
        run: |
          test -s "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" || { echo "trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed" >&2; exit 1; }
      - name: Run test phase
        id: phase
        continue-on-error: true
        run: |
          phase_output="$(mktemp)"
          trap 'rm -f "$phase_output"' EXIT
          set +e
          go run ./cmd/sam-harness pipeline . --config "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" --phase test --receipt true 2>&1 | tee "$phase_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          status="${pipeline_status[0]}"
          receipt="$(sed -n 's/^Receipt: //p' "$phase_output" | tail -n 1)"
          test -n "$receipt"
          test -f "$receipt"
          receipt_html="${receipt%.json}.html"
          test -f "$receipt_html"
          printf 'phase_receipt=%s\nphase_receipt_html=%s\n' "$receipt" "$receipt_html" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-test
          if-no-files-found: error
          path: |
            ${{ steps.phase.outputs.phase_receipt }}
            ${{ steps.phase.outputs.phase_receipt_html }}

      - name: Preserve the failed phase status
        if: steps.phase.outcome == 'failure'
        run: exit 1
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Run e2e phase
        run: 'go run ./cmd/sam-harness pipeline . --phase e2e --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-e2e
          if-no-files-found: error
          path: .sam-harness/evidence/
  artifact:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Check out trusted base configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: .sam-harness/evidence/trusted-control
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      - name: Require trusted base configuration
        run: |
          test -s "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" || { echo "trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed" >&2; exit 1; }
      - name: Run artifact phase
        id: phase
        continue-on-error: true
        run: |
          phase_output="$(mktemp)"
          trap 'rm -f "$phase_output"' EXIT
          set +e
          go run ./cmd/sam-harness pipeline . --config "${GITHUB_WORKSPACE}/.sam-harness/evidence/trusted-control/.sam-harness/config.yaml" --phase artifact --receipt true 2>&1 | tee "$phase_output"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[1]}" -eq 0
          status="${pipeline_status[0]}"
          receipt="$(sed -n 's/^Receipt: //p' "$phase_output" | tail -n 1)"
          test -n "$receipt"
          test -f "$receipt"
          receipt_html="${receipt%.json}.html"
          test -f "$receipt_html"
          printf 'phase_receipt=%s\nphase_receipt_html=%s\n' "$receipt" "$receipt_html" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Package immutable artifact with path and mode metadata
        if: steps.phase.outcome == 'success'
        run: |
          tar -cf "${RUNNER_TEMP}/sam-harness-immutable-artifact.tar" -- 'dist/sam-harness' 'dist/sam-harness.sbom.txt' 'dist/sam-harness.provenance.txt'
      - name: Preserve immutable artifact
        if: steps.phase.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-immutable-artifact
          if-no-files-found: error
          path: ${{ runner.temp }}/sam-harness-immutable-artifact.tar
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-artifact
          if-no-files-found: error
          path: |
            ${{ steps.phase.outputs.phase_receipt }}
            ${{ steps.phase.outputs.phase_receipt_html }}

      - name: Preserve the failed phase status
        if: steps.phase.outcome == 'failure'
        run: exit 1
  staging:
    runs-on: ubuntu-latest
    needs: artifact
    if: ${{ false }} # Required network, deploy, or release authority is not granted; keep this job structurally inactive.
    environment: 'staging'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Restore immutable artifact archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-immutable-artifact
          path: ${{ runner.temp }}/sam-harness-artifact-transfer
      - name: Extract immutable artifact with path and mode metadata
        run: |
          tar -xf "${RUNNER_TEMP}/sam-harness-artifact-transfer/sam-harness-immutable-artifact.tar" -C .
      - name: Restore artifact receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-receipts-artifact
          path: .sam-harness/evidence
      - name: Run staging phase
        id: phase
        run: 'go run ./cmd/sam-harness pipeline . --phase staging --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-staging
          if-no-files-found: error
          path: .sam-harness/evidence/

  migration:
    runs-on: ubuntu-latest
    needs: staging
    if: ${{ false }} # Required network, deploy, or release authority is not granted; keep this job structurally inactive.
    environment: 'staging'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Restore immutable artifact archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-immutable-artifact
          path: ${{ runner.temp }}/sam-harness-artifact-transfer
      - name: Extract immutable artifact with path and mode metadata
        run: |
          tar -xf "${RUNNER_TEMP}/sam-harness-artifact-transfer/sam-harness-immutable-artifact.tar" -C .
      - name: Restore artifact receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-receipts-artifact
          path: .sam-harness/evidence
      - name: Run migration phase
        id: phase
        run: 'go run ./cmd/sam-harness pipeline . --phase migration --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-migration
          if-no-files-found: error
          path: .sam-harness/evidence/

  production:
    runs-on: ubuntu-latest
    needs: migration
    if: ${{ false }} # Required network, deploy, or release authority is not granted; keep this job structurally inactive.
    environment: 'GitHub Releases'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Restore immutable artifact archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-immutable-artifact
          path: ${{ runner.temp }}/sam-harness-artifact-transfer
      - name: Extract immutable artifact with path and mode metadata
        run: |
          tar -xf "${RUNNER_TEMP}/sam-harness-artifact-transfer/sam-harness-immutable-artifact.tar" -C .
      - name: Restore artifact receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-receipts-artifact
          path: .sam-harness/evidence
      - name: Run production phase
        id: phase
        run: 'go run ./cmd/sam-harness pipeline . --phase production --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-production
          if-no-files-found: error
          path: .sam-harness/evidence/

  observe:
    runs-on: ubuntu-latest
    needs: production
    if: ${{ false }} # Required network, deploy, or release authority is not granted; keep this job structurally inactive.
    environment: 'GitHub Releases'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Restore immutable artifact archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-immutable-artifact
          path: ${{ runner.temp }}/sam-harness-artifact-transfer
      - name: Extract immutable artifact with path and mode metadata
        run: |
          tar -xf "${RUNNER_TEMP}/sam-harness-artifact-transfer/sam-harness-immutable-artifact.tar" -C .
      - name: Restore artifact receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-receipts-artifact
          path: .sam-harness/evidence
      - name: Run observe phase
        id: phase
        run: 'go run ./cmd/sam-harness pipeline . --phase observe --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-observe
          if-no-files-found: error
          path: .sam-harness/evidence/

  rollback:
    runs-on: ubuntu-latest
    if: ${{ false }} # Required network, deploy, or release authority is not granted; keep this job structurally inactive.
    permissions:
      actions: read
      contents: read
    environment: 'GitHub Releases'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Restore immutable artifact archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-immutable-artifact
          path: ${{ runner.temp }}/sam-harness-artifact-transfer
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Extract immutable artifact with path and mode metadata
        run: |
          tar -xf "${RUNNER_TEMP}/sam-harness-artifact-transfer/sam-harness-immutable-artifact.tar" -C .
      - name: Restore artifact receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-receipts-artifact
          path: .sam-harness/evidence
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Run rollback phase
        run: 'go run ./cmd/sam-harness pipeline . --phase rollback --receipt true'
      - name: Preserve rollback receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-rollback
          if-no-files-found: error
          path: .sam-harness/evidence/
