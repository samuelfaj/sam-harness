name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build ./cmd/sam-harness
      - name: Complete installed lifecycle
        run: ./testdata/e2e-full-flow.sh
      - name: Skill structure
        run: python3 scripts/validate-skill.py skills/sam-harness
      - name: Bootstrap shell syntax
        run: sh -n skills/sam-harness/scripts/bootstrap.sh scripts/release-build.sh
