# Generated by sam-harness. Edit .sam-harness/config.yaml, not this file.
# SECURITY: pull_request_target and repository_dispatch load this definition from the trusted default branch.
# Never execute target setup, hooks, caches, local actions, or repository commands in a secret-bearing job.
name: sam-harness agents

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [sam_harness_merge_group_review]
  workflow_run:
    workflows: [sam-harness]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      head_ref: ${{ steps.identity.outputs.head_ref }}
    steps:
      - name: Create least-privilege GitHub App identity token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SAM_HARNESS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SAM_HARNESS_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Resolve exact provider-owned pull request identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_KIND: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha || github.event.workflow_run.head_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.client_payload.base_sha }}
          EVENT_HEAD_REF: ${{ github.event.client_payload.merge_group_ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          head_sha="$EVENT_HEAD_SHA"
          pr_number="$EVENT_PR_NUMBER"
          head_ref="$EVENT_HEAD_REF"
          if [ "$EVENT_KIND" = workflow_run ]; then
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/pulls")"
            test "$(printf '%s' "$pulls" | jq 'length')" -eq 1 || { echo 'triggering head must resolve to exactly one current pull request' >&2; exit 1; }
            pr_number="$(printf '%s' "$pulls" | jq -r '.[0].number')"
          fi
          if [ "$EVENT_KIND" = repository_dispatch ]; then
            case "$EVENT_HEAD_REF" in
              refs/heads/gh-readonly-queue/*) ;;
              *) echo 'repository dispatch must name a provider-owned merge-queue ref' >&2; exit 1 ;;
            esac
            printf '%s\n' "$head_sha" | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
            printf '%s\n' "$EVENT_BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
            base_sha="$EVENT_BASE_SHA"
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${EVENT_HEAD_REF#refs/}" --jq .object.sha)"
            test "$current_head" = "$head_sha" || { echo 'merge-group head drifted before trusted agent execution' >&2; exit 1; }
            default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
            current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq .object.sha)"
            test "$current_base" = "$base_sha" || { echo 'merge-group base drifted before trusted agent execution' >&2; exit 1; }
          else
            test -n "$pr_number"
            pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            current_head="$(printf '%s' "$pull" | jq -r '.head.sha')"
            base_sha="$(printf '%s' "$pull" | jq -r '.base.sha')"
            head_ref="$(printf '%s' "$pull" | jq -r '.head.ref')"
            test "$current_head" = "$head_sha" || { echo 'pull request head drifted before trusted agent execution' >&2; exit 1; }
          fi
          printf '%s\n' "$head_sha" | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
          printf '%s\n' "$base_sha" | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
          if [ "$EVENT_KIND" = pull_request_target ]; then
            test "$base_sha" = "$EVENT_BASE_SHA"
          fi
          printf 'head_sha=%s\nbase_sha=%s\npr_number=%s\nsource_run_id=%s\nhead_ref=%s\n' "$head_sha" "$base_sha" "$pr_number" "$SOURCE_RUN_ID" "$head_ref" >> "$GITHUB_OUTPUT"

  start_review_check:
    if: github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    outputs:
      check_run_id: ${{ steps.check.outputs.check_run_id }}
    steps:
      - name: Create least-privilege GitHub App check token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SAM_HARNESS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SAM_HARNESS_GITHUB_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Create pending required check on the exact pull request head
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -eu
          check_run_id="$(gh api --method POST -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/check-runs" -f name='sam-harness/trusted-review' -f head_sha="$REVIEW_HEAD_SHA" -f status=in_progress --jq .id)"
          test -n "$check_run_id"
          printf 'check_run_id=%s\n' "$check_run_id" >> "$GITHUB_OUTPUT"

  review:
    if: github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch'
    needs: [resolve, start_review_check]
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    permissions:
      contents: read
    steps:
      - name: Check out exact target SHA as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: target
      - name: Check out exact trusted base SHA as control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted-control
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Require released harness and trusted base configuration
        run: |
          set -eu
          test -s "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" || { echo 'trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed' >&2; exit 1; }
          go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 help >/dev/null || { echo 'released sam-harness v0.6.0 is unavailable; release it before enabling secret-bearing CI' >&2; exit 1; }
      - name: Run six-role review from trusted base control plane
        id: phase
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          test -n "${OPENAI_API_KEY:-}" || { echo "required protected environment secret OPENAI_API_KEY is unavailable; fork and untrusted pull requests fail closed" >&2; exit 1; }
          set +e
          output="$(go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 pipeline "${GITHUB_WORKSPACE}/target" --config "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" --review-base "${GITHUB_WORKSPACE}/trusted-control" --review-base-sha "${{ needs.resolve.outputs.base_sha }}" --review-head-sha "${{ needs.resolve.outputs.head_sha }}" --phase review --receipt true 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          receipt="$(printf '%s\n' "$output" | sed -n 's/^Receipt: //p' | tail -n 1)"
          test -n "$receipt"
          test -f "$receipt"
          review_patch="$(jq -r '.review_patch // empty' "$receipt")"
          review_patch_sha256="$(jq -r '.review_patch_sha256 // empty' "$receipt")"
          test -n "$review_patch"
          test -n "$review_patch_sha256"
          test -f "$review_patch"
          case "$review_patch" in
            "${GITHUB_WORKSPACE}"/target/.sam-harness/evidence/*-review.patch) ;;
            *) echo 'review patch is outside the target evidence directory' >&2; exit 1 ;;
          esac
          actual_review_patch_sha256="$(sha256sum "$review_patch" | awk '{print $1}')"
          test "$actual_review_patch_sha256" = "$review_patch_sha256"
          test "$(jq -r '.review_base_sha' "$receipt")" = "${{ needs.resolve.outputs.base_sha }}"
          test "$(jq -r '.review_head_sha' "$receipt")" = "${{ needs.resolve.outputs.head_sha }}"
          printf 'phase_receipt=%s\nreview_patch=%s\n' "$receipt" "$review_patch" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Preserve trusted review receipt and exact patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-trusted-review-evidence
          if-no-files-found: error
          path: |
            ${{ steps.phase.outputs.phase_receipt }}
            ${{ steps.phase.outputs.review_patch }}
      - name: Preserve the failed trusted review status
        if: steps.phase.outcome == 'failure'
        run: exit 1

  conclude_review_check:
    if: always() && (github.event_name == 'pull_request_target' || github.event_name == 'repository_dispatch') && needs.resolve.result == 'success' && needs.start_review_check.result == 'success'
    needs: [resolve, start_review_check, review]
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    steps:
      - name: Create least-privilege GitHub App check token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SAM_HARNESS_GITHUB_APP_ID }}
          private-key: ${{ secrets.SAM_HARNESS_GITHUB_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read
      - name: Revalidate current head and conclude required check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REVIEW_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REVIEW_HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
          EVENT_KIND: ${{ github.event_name }}
          CHECK_RUN_ID: ${{ needs.start_review_check.outputs.check_run_id }}
        run: |
          set -eu
          if [ -n "$PR_NUMBER" ]; then
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          else
            test -n "$REVIEW_HEAD_REF"
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${REVIEW_HEAD_REF#refs/}" --jq .object.sha 2>/dev/null || true)"
          fi
          current_base="$REVIEW_BASE_SHA"
          if [ "$EVENT_KIND" = repository_dispatch ]; then
            default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
            current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${default_branch}" --jq .object.sha 2>/dev/null || true)"
          fi
          conclusion=failure
          summary='Trusted six-role review failed or did not complete.'
          if [ "$current_head" != "$REVIEW_HEAD_SHA" ] || [ "$current_base" != "$REVIEW_BASE_SHA" ]; then
            summary='Pull request or merge-group identity changed during trusted review; stale success is forbidden.'
          elif [ "$REVIEW_RESULT" = success ]; then
            conclusion=success
            summary='Trusted six-role review passed for the current pull request head.'
          fi
          gh api --method PATCH -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" -f status=completed -f conclusion="$conclusion" -f 'output[title]=sam-harness trusted review' -f "output[summary]=$summary" >/dev/null
          test "$conclusion" = success

  repair_review:
    if: always() && github.event_name == 'pull_request_target' && needs.resolve.result == 'success' && needs.review.result == 'failure' && !startsWith(needs.resolve.outputs.head_ref, 'sam-harness/repair/')
    needs: [resolve, review]
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact target SHA as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: target
      - name: Check out exact trusted base SHA as control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted-control
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Require released harness and trusted base configuration
        run: |
          set -eu
          test -s "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" || { echo 'trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed' >&2; exit 1; }
          go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 help >/dev/null || { echo 'released sam-harness v0.6.0 is unavailable; release it before enabling secret-bearing CI' >&2; exit 1; }
      - name: Restore exact failed trusted review receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sam-harness-trusted-review-evidence
          path: target/.sam-harness/evidence/repair-input
      - name: Run one bounded repair from trusted base control plane
        id: repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          test -n "${OPENAI_API_KEY:-}" || { echo "required protected environment secret OPENAI_API_KEY is unavailable; fork and untrusted pull requests fail closed" >&2; exit 1; }
          receipt_count="$(find "${GITHUB_WORKSPACE}/target/.sam-harness/evidence/repair-input" -type f -name '*-pipeline-review.json' -print | wc -l | tr -d '[:space:]')"
          test "$receipt_count" -eq 1
          receipt="$(find "${GITHUB_WORKSPACE}/target/.sam-harness/evidence/repair-input" -type f -name '*-pipeline-review.json' -print)"
          test "$(jq -r '.status' "$receipt")" = blocked
          repair_output="$(go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 repair "${GITHUB_WORKSPACE}/target" --config "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" --receipt "$receipt" --receipt-output true 2>&1)"
          printf '%s\n' "$repair_output"
          repair_receipt="$(printf '%s\n' "$repair_output" | sed -n 's/^Receipt: //p' | tail -n 1)"
          test -n "$repair_receipt"
          test -f "$repair_receipt"
          repair_patch="$(jq -r '.repair_patch // empty' "$repair_receipt")"
          repair_patch_sha256="$(jq -r '.repair_patch_sha256 // empty' "$repair_receipt")"
          test -n "$repair_patch"
          test -n "$repair_patch_sha256"
          test -f "$repair_patch"
          case "$repair_patch" in
            "${GITHUB_WORKSPACE}"/target/.sam-harness/evidence/*-repair.patch) ;;
            *) echo 'repair patch is outside the target evidence directory' >&2; exit 1 ;;
          esac
          actual_repair_patch_sha256="$(sha256sum "$repair_patch" | awk '{print $1}')"
          test "$actual_repair_patch_sha256" = "$repair_patch_sha256"
          printf 'repair_patch=%s\nrepair_receipt=%s\n' "$repair_patch" "$repair_receipt" >> "$GITHUB_OUTPUT"
      - name: Preserve canonical repair patch and receipt as untrusted data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-agent-repair
          if-no-files-found: error
          path: |
            ${{ steps.repair.outputs.repair_patch }}
            ${{ steps.repair.outputs.repair_receipt }}

  repair_failed_phase:
    if: github.event_name == 'workflow_run' && needs.resolve.result == 'success'
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: 'sam-harness-agents'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact target SHA as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: target
      - name: Check out exact trusted base SHA as control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted-control
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Require released harness and trusted base configuration
        run: |
          set -eu
          test -s "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" || { echo 'trusted base .sam-harness/config.yaml is unavailable; initial adoption fails closed' >&2; exit 1; }
          go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 help >/dev/null || { echo 'released sam-harness v0.6.0 is unavailable; release it before enabling secret-bearing CI' >&2; exit 1; }
      - name: Restore exact triggering run receipts as untrusted data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sam-harness-receipts-*
          path: target/.sam-harness/evidence/repair-input
          merge-multiple: false
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Run one bounded repair from trusted base control plane
        id: repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          test -n "${OPENAI_API_KEY:-}" || { echo "required protected environment secret OPENAI_API_KEY is unavailable; fork and untrusted pull requests fail closed" >&2; exit 1; }
          receipt_list="${RUNNER_TEMP}/sam-harness-failed-receipts"
          : > "$receipt_list"
          for phase in static test artifact; do
            find "${GITHUB_WORKSPACE}/target/.sam-harness/evidence/repair-input" -type f -name "*-pipeline-${phase}.json" -print | sort | while IFS= read -r candidate; do
              if [ "$(jq -r '.status' "$candidate")" = failed; then
                printf '%s\n' "$candidate"
              fi
            done >> "$receipt_list"
          done
          test "$(wc -l < "$receipt_list" | tr -d '[:space:]')" -eq 1 || { echo 'triggering run must contain exactly one failed static, test, or artifact receipt' >&2; exit 1; }
          receipt="$(cat "$receipt_list")"
          repair_output="$(go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.6.0 repair "${GITHUB_WORKSPACE}/target" --config "${GITHUB_WORKSPACE}/trusted-control/.sam-harness/config.yaml" --receipt "$receipt" --receipt-output true 2>&1)"
          printf '%s\n' "$repair_output"
          repair_receipt="$(printf '%s\n' "$repair_output" | sed -n 's/^Receipt: //p' | tail -n 1)"
          test -n "$repair_receipt"
          test -f "$repair_receipt"
          repair_patch="$(jq -r '.repair_patch // empty' "$repair_receipt")"
          repair_patch_sha256="$(jq -r '.repair_patch_sha256 // empty' "$repair_receipt")"
          test -n "$repair_patch"
          test -n "$repair_patch_sha256"
          test -f "$repair_patch"
          case "$repair_patch" in
            "${GITHUB_WORKSPACE}"/target/.sam-harness/evidence/*-repair.patch) ;;
            *) echo 'repair patch is outside the target evidence directory' >&2; exit 1 ;;
          esac
          actual_repair_patch_sha256="$(sha256sum "$repair_patch" | awk '{print $1}')"
          test "$actual_repair_patch_sha256" = "$repair_patch_sha256"
          printf 'repair_patch=%s\nrepair_receipt=%s\n' "$repair_patch" "$repair_receipt" >> "$GITHUB_OUTPUT"
      - name: Preserve canonical repair patch and receipt as untrusted data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-agent-repair
          if-no-files-found: error
          path: |
            ${{ steps.repair.outputs.repair_patch }}
            ${{ steps.repair.outputs.repair_receipt }}
